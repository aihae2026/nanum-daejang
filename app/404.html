<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — 나눔대장</title>
<!-- 이 파일이 있어야 Cloudflare Pages 가 없는 경로에 index.html 을 200 으로 돌려주지 않는다.
     (2026-09-01 연수 발견) 200 이 오면 index.html 의 onerror 폴백이 안 걸리고,
     스크립트 경로에 오타를 내도 404 가 안 나 조용히 넘어간다. -->
<style>
  body{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;
       display:grid;place-items:center;min-height:90vh;margin:0;color:#333}
  .box{text-align:center}
  h1{font-size:1.4rem;margin:0 0 .5rem}
  p{color:#666;margin:0 0 1.2rem}
  a{color:#0b6}
</style>
</head>
<body>
<div class="box">
  <h1>페이지를 찾을 수 없습니다</h1>
  <p>주소를 다시 확인해 주세요.</p>
  <a href="/">나눔대장 처음으로</a>
</div>
</body>
</html>
