<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-label="브라우저가 Cloudflare Pages 에서 화면을 받고 Supabase 에 읽고 쓰며, 검수 요청은 Cloudflare 서버함수를 거쳐 Supabase 릴레이(서울)를 통해 Google Gemini 로 가고 판정이 돌아온다."><rect width="1100" height="330" fill="#ffffff"/>
      <defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
      <!-- 브라우저 -->
      <rect x="20" y="70" width="200" height="200" rx="14" fill="#eef4f0" stroke="#c9d5ce"/>
      <text x="120" y="98" text-anchor="middle" font-size="14" font-weight="900" fill="currentColor">브라우저</text>
      <text x="120" y="116" text-anchor="middle" font-size="11.5" fill="#66756e">설치 없음 · 웹 주소로 접속</text>
      <g font-size="12.5" font-weight="700" text-anchor="middle">
        <rect x="40" y="132" width="160" height="34" rx="8" fill="#ffffff" stroke="#009465"/><text x="120" y="154" fill="currentColor">담당자 · 관리자 화면</text>
        <rect x="40" y="176" width="160" height="34" rx="8" fill="#ffffff" stroke="#E8C94E"/><text x="120" y="198" fill="currentColor">후원자 폼 (폰)</text>
        <rect x="40" y="220" width="160" height="34" rx="8" fill="#ffffff" stroke="#00ACA7"/><text x="120" y="242" fill="currentColor">배분기관 폼</text>
      </g>
      <!-- Cloudflare -->
      <rect x="300" y="30" width="210" height="110" rx="14" fill="#ffffff" stroke="#c9d5ce"/>
      <text x="405" y="58" text-anchor="middle" font-size="14" font-weight="900" fill="currentColor">Cloudflare Pages</text>
      <text x="405" y="76" text-anchor="middle" font-size="11.5" fill="#66756e">nanumdaejang.org</text>
      <g font-size="12" text-anchor="middle" fill="#3f4f48"><text x="405" y="100">화면 파일 (HTML·JS·CSS)</text><text x="405" y="120">서버함수 judge — 검수 질문 만들기</text></g>
      <!-- Supabase -->
      <rect x="600" y="30" width="230" height="270" rx="14" fill="#ffffff" stroke="#009465" stroke-width="1.5"/>
      <text x="715" y="58" text-anchor="middle" font-size="14" font-weight="900" fill="currentColor">Supabase (서울)</text>
      <text x="715" y="76" text-anchor="middle" font-size="11.5" fill="#66756e">저장과 로그인을 맡는 서버</text>
      <g font-size="12" text-anchor="middle">
        <rect x="620" y="92" width="190" height="40" rx="8" fill="#e3f5f4"/><text x="715" y="109" font-weight="700" fill="#00ACA7">AI 릴레이 (서울 고정)</text><text x="715" y="124" font-size="11" fill="#66756e">Google API 키를 붙여 전달</text>
        <rect x="620" y="140" width="190" height="40" rx="8" fill="#eef4f0"/><text x="715" y="157" font-weight="700" fill="currentColor">데이터베이스 · 표 10개</text><text x="715" y="172" font-size="11" fill="#66756e">건 · 서류 목록 · 판정 · 기록</text>
        <rect x="620" y="188" width="190" height="40" rx="8" fill="#eef4f0"/><text x="715" y="205" font-weight="700" fill="currentColor">파일 저장소</text><text x="715" y="220" font-size="11" fill="#66756e">첨부 파일 · 신청서 PDF</text>
        <rect x="620" y="236" width="190" height="40" rx="8" fill="#eef4f0"/><text x="715" y="253" font-weight="700" fill="currentColor">로그인 (Auth)</text><text x="715" y="268" font-size="11" fill="#66756e">담당자 계정 · 권한 규칙(RLS)</text>
      </g>
      <!-- Gemini -->
      <rect x="920" y="72" width="160" height="80" rx="14" fill="#e3f5f4" stroke="#00ACA7" stroke-width="1.5"/>
      <text x="1000" y="102" text-anchor="middle" font-size="14" font-weight="900" fill="#00ACA7">Google Gemini</text>
      <text x="1000" y="122" text-anchor="middle" font-size="11.5" fill="#66756e">첨부를 읽는 AI 모델</text>
      <!-- 화살표 -->
      <g fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#ar2)">
        <path d="M220 90 H298"/>
        <path d="M220 124 H298"/>
        <path d="M220 200 H598"/>
        <path d="M510 112 H618"/>
        <path d="M810 112 H918"/>
      </g>
      <g font-size="11.5" fill="#3f4f48">
        <text x="259" y="84" text-anchor="middle">화면 열기</text>
        <text x="259" y="140" text-anchor="middle">검수 요청</text>
        <text x="400" y="216" text-anchor="middle">읽기 · 쓰기 · 파일 올리기</text>
        <text x="400" y="232" text-anchor="middle" fill="#66756e">(로그인 토큰 또는 링크 토큰으로)</text>
        <text x="564" y="104" text-anchor="middle">질문을 서울로</text>
        <text x="864" y="104" text-anchor="middle">파일 + 질문</text>
        <text x="864" y="132" text-anchor="middle" fill="#66756e">← 판정</text>
      </g>
    </svg>