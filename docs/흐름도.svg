<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="나눔대장에서 후원물품 한 건이 흘러가는 길. 재단 담당자가 새 건을 열고 후원자에게 링크를 보내면 후원자가 신청서와 첨부를 제출하고, 담당자가 AI 검수를 실행해 확인한 뒤 배분기관을 정해 증빙 링크를 보내며, 배분기관이 인수증 등을 제출하면 다시 검수를 거쳐 담당자가 완결을 확정한다." font-family="'Noto Sans KR','Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink,#1c2b26)"/></marker>
    <marker id="fa-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--g,#009465)"/></marker>
  </defs>
  <rect width="1600" height="900" fill="var(--paper,#ffffff)"/>

  <!-- 제목 -->
  <text x="60" y="72" font-size="32" font-weight="900" fill="var(--ink,#1c2b26)" letter-spacing="-0.5">나눔대장 업무 흐름 — 후원물품 접수부터 완결까지</text>
  <text x="60" y="104" font-size="16" fill="var(--muted,#66756e)">동그라미 숫자는 건 상세 화면의 진행 단계(1~6)와 같다.</text>

  <!-- 범례 -->
  <g font-size="13" fill="var(--ink-2,#3f4f48)">
    <line x1="940" y1="66" x2="1000" y2="66" stroke="var(--g,#009465)" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#fa-link)"/>
    <text x="1010" y="71">링크 전달</text>
    <line x1="940" y1="96" x2="1000" y2="96" stroke="var(--ink,#1c2b26)" stroke-width="2.2" marker-end="url(#fa)"/>
    <text x="1010" y="101">서류 제출 · 다음 단계로</text>
    <rect x="1190" y="54" width="88" height="24" rx="12" fill="var(--paper,#ffffff)" stroke="var(--g,#009465)" stroke-width="1.5"/>
    <text x="1234" y="71" text-anchor="middle" font-weight="700" fill="var(--g,#009465)">규칙 검사</text>
    <text x="1288" y="71">폼 입력값 · 수량 · 날짜 · 금액 대조</text>
    <rect x="1190" y="84" width="88" height="24" rx="12" fill="var(--ai,#00ACA7)"/>
    <text x="1234" y="101" text-anchor="middle" font-weight="700" fill="#ffffff">AI 검수</text>
    <text x="1288" y="101">첨부 파일의 내용 판독</text>
    <rect x="1190" y="114" width="88" height="24" rx="12" fill="var(--paper,#ffffff)" stroke="var(--gold,#E8C94E)" stroke-width="2"/>
    <text x="1234" y="131" text-anchor="middle" font-weight="700" fill="var(--ink,#1c2b26)">담당자 확정</text>
    <text x="1288" y="131">항목별 판정을 확인하고 확정 — AI가 놓칠 수 있으므로</text>
  </g>

  <!-- 줄 -->
  <g stroke="var(--line,#dfe6e2)" stroke-width="1.2">
    <line x1="40" y1="190" x2="1560" y2="190"/>
    <line x1="40" y1="400" x2="1560" y2="400"/>
    <line x1="40" y1="610" x2="1560" y2="610"/>
    <line x1="40" y1="820" x2="1560" y2="820"/>
  </g>
  <!-- 줄 이름 -->
  <g>
    <circle cx="60" cy="286" r="9" fill="var(--gold,#E8C94E)"/>
    <text x="78" y="292" font-size="19" font-weight="900" fill="var(--ink,#1c2b26)">후원자</text>
    <text x="60" y="318" font-size="13" fill="var(--muted,#66756e)">기업 · 개인</text>
    <text x="60" y="338" font-size="13" fill="var(--muted,#66756e)">링크로 접속 (휴대폰)</text>

    <circle cx="60" cy="496" r="9" fill="var(--g,#009465)"/>
    <text x="78" y="502" font-size="19" font-weight="900" fill="var(--ink,#1c2b26)">재단 담당자</text>
    <text x="60" y="528" font-size="13" fill="var(--muted,#66756e)">후원물품 실무자</text>
    <text x="60" y="548" font-size="13" fill="var(--muted,#66756e)">로그인 (PC)</text>

    <circle cx="60" cy="706" r="9" fill="var(--mint,#00ACA7)"/>
    <text x="78" y="712" font-size="19" font-weight="900" fill="var(--ink,#1c2b26)">배분기관</text>
    <text x="60" y="738" font-size="13" fill="var(--muted,#66756e)">물품을 받는 복지기관</text>
    <text x="60" y="758" font-size="13" fill="var(--muted,#66756e)">링크로 접속</text>
  </g>

  <!-- 상자: 담당자 줄 (y 465–545) -->
  <g font-size="14" text-anchor="middle">
    <!-- A1 신규 접수 -->
    <rect x="240" y="465" width="200" height="80" rx="12" fill="var(--paper,#ffffff)" stroke="var(--g,#009465)" stroke-width="2"/>
    <text x="340" y="499" font-size="17" font-weight="900" fill="var(--ink,#1c2b26)">신규 접수</text>
    <text x="340" y="523" fill="var(--muted,#66756e)">후원자 유형 · 취득 경로 선택</text>
    <text x="340" y="540" fill="var(--muted,#66756e)" font-size="13">필수 서류 목록 자동 생성</text>
    <!-- A2 링크 보내기 -->
    <rect x="480" y="465" width="200" height="80" rx="12" fill="var(--paper,#ffffff)" stroke="var(--g,#009465)" stroke-width="2"/>
    <text x="580" y="499" font-size="17" font-weight="900" fill="var(--ink,#1c2b26)">접수 링크 발송</text>
    <text x="580" y="526" fill="var(--muted,#66756e)">메일 또는 직접 전달</text>
    <!-- A3 검수 실행 -->
    <rect x="720" y="465" width="200" height="80" rx="12" fill="var(--paper,#ffffff)" stroke="var(--g,#009465)" stroke-width="2"/>
    <text x="820" y="499" font-size="17" font-weight="900" fill="var(--ink,#1c2b26)">후원자 서류 검수</text>
    <text x="820" y="526" fill="var(--muted,#66756e)">항목별 판정 확인 · 사유 기재</text>
    <!-- A4 배분기관 지정 -->
    <rect x="960" y="465" width="200" height="80" rx="12" fill="var(--paper,#ffffff)" stroke="var(--g,#009465)" stroke-width="2"/>
    <text x="1060" y="499" font-size="17" font-weight="900" fill="var(--ink,#1c2b26)">배분기관 지정</text>
    <text x="1060" y="526" fill="var(--muted,#66756e)">기관 · 수량 결정</text>
    <!-- A6 배분 증빙 검수 -->
    <rect x="1200" y="465" width="200" height="80" rx="12" fill="var(--paper,#ffffff)" stroke="var(--g,#009465)" stroke-width="2"/>
    <text x="1300" y="499" font-size="17" font-weight="900" fill="var(--ink,#1c2b26)">배분 증빙 검수</text>
    <text x="1300" y="526" fill="var(--muted,#66756e)">기관별 항목 확인</text>
    <!-- A7 완결 확정 (오른쪽 끝, 짧게) -->
    <rect x="1440" y="465" width="120" height="80" rx="12" fill="var(--g-deep,#005B48)" stroke="var(--gold,#E8C94E)" stroke-width="3"/>
    <text x="1500" y="499" font-size="17" font-weight="900" fill="#ffffff">최종 확정</text>
    <text x="1500" y="526" fill="rgba(255,255,255,.85)" font-size="13">담당자가 직접</text>

    <!-- D1 후원자 줄 (y 255–335) -->
    <rect x="480" y="255" width="200" height="80" rx="12" fill="var(--paper,#ffffff)" stroke="var(--gold,#E8C94E)" stroke-width="2.5"/>
    <text x="580" y="289" font-size="17" font-weight="900" fill="var(--ink,#1c2b26)">신청서 작성·제출</text>
    <text x="580" y="316" fill="var(--muted,#66756e)">폼 작성 · 서명 · 증빙 첨부</text>

    <!-- O1 배분기관 줄 (y 675–755) -->
    <rect x="960" y="675" width="200" height="80" rx="12" fill="var(--paper,#ffffff)" stroke="var(--mint,#00ACA7)" stroke-width="2.5"/>
    <text x="1060" y="709" font-size="17" font-weight="900" fill="var(--ink,#1c2b26)">증빙 제출</text>
    <text x="1060" y="736" fill="var(--muted,#66756e)">인수증 · 물품사진 · 결과보고</text>
  </g>

  <!-- 단계 배지 -->
  <g font-size="14" font-weight="900" text-anchor="middle" fill="#ffffff">
    <circle cx="240" cy="465" r="14" fill="var(--g,#009465)"/><text x="240" y="470">1</text>
    <circle cx="480" cy="465" r="14" fill="var(--g,#009465)"/><text x="480" y="470">1</text>
    <circle cx="480" cy="255" r="14" fill="var(--g,#009465)"/><text x="480" y="260">1</text>
    <circle cx="720" cy="465" r="14" fill="var(--g,#009465)"/><text x="720" y="470">2</text>
    <circle cx="960" cy="465" r="14" fill="var(--g,#009465)"/><text x="960" y="470">3</text>
    <circle cx="960" cy="675" r="14" fill="var(--g,#009465)"/><text x="960" y="680">4</text>
    <circle cx="1200" cy="465" r="14" fill="var(--g,#009465)"/><text x="1200" y="470">5</text>
    <circle cx="1440" cy="465" r="14" fill="var(--gold,#E8C94E)"/><text x="1440" y="470" fill="var(--ink,#1c2b26)">6</text>
  </g>

  <!-- AI 표식 -->
  <g font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">
    <rect x="700" y="556" width="76" height="24" rx="12" fill="var(--paper,#ffffff)" stroke="var(--g,#009465)" stroke-width="1.5"/><text x="738" y="572" fill="var(--g,#009465)">규칙 검사</text>
    <rect x="782" y="556" width="66" height="24" rx="12" fill="var(--ai,#00ACA7)"/><text x="815" y="572">AI 검수</text>
    <path d="M851 568 H864" stroke="var(--ink,#1c2b26)" stroke-width="1.8" fill="none" marker-end="url(#fa)"/>
    <rect x="868" y="556" width="88" height="24" rx="12" fill="var(--paper,#ffffff)" stroke="var(--gold,#E8C94E)" stroke-width="2"/><text x="912" y="572" fill="var(--ink,#1c2b26)">담당자 확정</text>
    <rect x="1190" y="556" width="76" height="24" rx="12" fill="var(--paper,#ffffff)" stroke="var(--g,#009465)" stroke-width="1.5"/><text x="1228" y="572" fill="var(--g,#009465)">규칙 검사</text>
    <rect x="1272" y="556" width="66" height="24" rx="12" fill="var(--ai,#00ACA7)"/><text x="1305" y="572">AI 검수</text>
    <path d="M1341 568 H1354" stroke="var(--ink,#1c2b26)" stroke-width="1.8" fill="none" marker-end="url(#fa)"/>
    <rect x="1358" y="556" width="88" height="24" rx="12" fill="var(--paper,#ffffff)" stroke="var(--gold,#E8C94E)" stroke-width="2"/><text x="1402" y="572" fill="var(--ink,#1c2b26)">담당자 확정</text>
  </g>

  <!-- 화살표: 서류·진행 (실선) -->
  <g fill="none" stroke="var(--ink,#1c2b26)" stroke-width="2.2" marker-end="url(#fa)">
    <line x1="440" y1="505" x2="478" y2="505"/>
    <path d="M680 295 H820 V463"/>
    <line x1="920" y1="505" x2="958" y2="505"/>
    <path d="M1160 715 H1180 V505 H1198"/>
    <line x1="1400" y1="505" x2="1438" y2="505"/>
  </g>
  <!-- 화살표: 링크 (점선) -->
  <g fill="none" stroke="var(--g,#009465)" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#fa-link)">
    <line x1="580" y1="465" x2="580" y2="337"/>
    <line x1="1060" y1="545" x2="1060" y2="673"/>
  </g>
  <!-- 화살표 이름 -->
  <g font-size="13.5" fill="var(--ink-2,#3f4f48)">
    <text x="592" y="405" fill="var(--g,#009465)" font-weight="700">접수 링크</text>
    <text x="592" y="424" fill="var(--muted,#66756e)">30일 유효 · 해당 건만 접근 가능</text>
    <text x="832" y="380" font-weight="700">제출</text>
    <text x="832" y="399" fill="var(--muted,#66756e)">신청서는 PDF로 저장</text>
    <text x="1048" y="615" text-anchor="end" fill="var(--g,#009465)" font-weight="700">증빙 링크</text>
    <text x="1048" y="634" text-anchor="end" fill="var(--muted,#66756e)">기관별로 발급</text>
    <text x="1192" y="700" font-weight="700">제출</text>
  </g>

  <!-- 아래 요약 -->
  <g font-size="14.5" fill="var(--ink-2,#3f4f48)">
    <circle cx="70" cy="861" r="5" fill="var(--ai,#00ACA7)"/>
    <text x="84" y="866">검수 단계마다 규칙 검사·AI 검수가 판정을 표시하고, 담당자가 항목별로 확인·확정한다 (AI 누락 대비)</text>
    <circle cx="880" cy="861" r="5" fill="var(--gold,#E8C94E)"/>
    <text x="894" y="866">완결도 담당자가 확정한다 — 자동 완결 없음</text>
    <circle cx="1280" cy="861" r="5" fill="var(--g,#009465)"/>
    <text x="1294" y="866">개인정보는 신청서 PDF에만 저장</text>
  </g>
</svg>
